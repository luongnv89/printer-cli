[project]
name = "printer-cli"
version = "0.2.0"
description = "Your printer's dashboard in the terminal: ink, paper, alerts, nozzle checks, head cleaning, printing and scanning for network printers (IPP, eSCL, SNMP, Epson ESC/P2), plus photo booth, magazine article and vintage newspaper printing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/prt/fonts/OFL-*.txt"]
authors = [{ name = "Luong NGUYEN" }]
keywords = ["printer", "cli", "tui", "ipp", "escl", "airprint", "snmp", "epson", "scanner", "ink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "httpx>=0.27",
    "zeroconf>=0.132",
    "pillow>=10.1",
    "shellingham>=1.5.4",
]

[project.urls]
Homepage = "https://github.com/luongnv89/printer-cli"
Repository = "https://github.com/luongnv89/printer-cli"
Issues = "https://github.com/luongnv89/printer-cli/issues"
Changelog = "https://github.com/luongnv89/printer-cli/blob/main/CHANGELOG.md"

[project.scripts]
prt = "prt.cli:main"
printer-cli = "prt.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.18",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prt"]

# The agent skills live once, in skills/ at the repository root; the wheel carries a copy for `prt skills install`.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "prt/bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
exclude = ["assets", ".idd.yml", "uv.lock"]
