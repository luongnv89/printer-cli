[project]
name = "printer-cli"
version = "0.2.0"
description = "Your printer's dashboard in the terminal: ink, paper, alerts, nozzle checks, head cleaning, printing and scanning for network printers (IPP, eSCL, SNMP, Epson ESC/P2), plus photo booth, magazine article and vintage newspaper printing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/prt/fonts/OFL-*.txt"]
authors = [{ name = "Luong NGUYEN" }]
keywords = ["printer", "cli", "tui", "ipp", "escl", "airprint", "snmp", "epson", "scanner", "ink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "httpx>=0.27",
    "zeroconf>=0.132",
    "pillow>=10.1",
    "shellingham>=1.5.4",
    "segno>=1.6,<2",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/luongnv89/printer-cli"
Repository = "https://github.com/luongnv89/printer-cli"
Issues = "https://github.com/luongnv89/printer-cli/issues"
Changelog = "https://github.com/luongnv89/printer-cli/blob/main/CHANGELOG.md"

[project.scripts]
prt = "prt.cli:main"
printer-cli = "prt.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pytest-cov>=6",
    "jsonschema>=4.18",
    "mcp>=2.3,<3",
    "mypy>=2.4",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prt"]

# The agent skills live once, in skills/ at the repository root; the wheel carries a copy for `prt skills install`.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "prt/bundled_skills"

[tool.ruff]
line-length = 120  # the code's own width: 99% of lines are 116 characters or shorter
target-version = "py311"

[tool.ruff.lint]
# The core rules: syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]

# The bandit pre-commit hook scans src/ with these settings. High and medium findings are fixed or
# marked `# nosec <id>` with a reason on the line; only these low-severity tests are skipped.
[tool.bandit]
skips = [
    "B311",  # random: seeded layout randomness only (puzzle, bingo, booth); tokens and nonces use `secrets`
    "B404",  # import subprocess: needed to run CUPS lp/lpstat and git
    "B603",  # no shell: argv lists; user values only as option values or absolute paths (B602/B604 stay on)
    "B607",  # partial executable path: lp, lpstat and git are found on PATH by design
]

# The mypy pre-commit hook type-checks src/ with these settings. A `# type: ignore[code]` carries its reason
# after it on the same line; there is no global ignore_missing_imports or ignore_errors.
[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
exclude = ["assets", ".idd.yml", "uv.lock", "site"]
